spring.application.name=test-task

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

spring.datasource.url=${DB_URL:jdbc:postgresql://test-db:5432/test-task}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

limit.default.amount=${LIMIT_DEFAULT_AMOUNT:1000}
exchange-rate.url=${EXCHANGE_RATE_URL:https://api.frankfurter.dev}